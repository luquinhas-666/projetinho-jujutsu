<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>Meu primeiro Blazor</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="estudo.styles.css" />
</head>
<body>
    <div id="app">
        <div class="container py-5 text-center">
            <div class="spinner-border text-primary" role="status" aria-label="Carregando"></div>
            <p class="mt-3">Carregando aplicação Blazor...</p>
        </div>
    </div>
    <div id="blazor-error-ui" class="alert alert-danger m-3" role="alert" style="display:none">
        Ocorreu um erro ao iniciar a aplicação.
        <a href="" class="reload">Recarregar</a>
        <button type="button" class="btn-close float-end" aria-label="Fechar" onclick="this.parentElement.style.display='none'"></button>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
